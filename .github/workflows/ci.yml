name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  router:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare the exact backend for offline-build regression
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m pip download --only-binary=:all: --no-deps --dest "$RUNNER_TEMP/solaris-build-backend" setuptools==84.2.1
          python - <<'PYCODE'
          import hashlib, os, pathlib
          wheel = pathlib.Path(os.environ['RUNNER_TEMP']) / 'solaris-build-backend/setuptools-84.2.1-py3-none-any.whl'
          assert hashlib.sha256(wheel.read_bytes()).hexdigest() == 'ca140b45d5325a9478f880e351484f62fef15f336462e449ca0c03c873d589c2', 'Build backend wheel digest mismatch'
          PYCODE
          echo "G40_WHEELHOUSE=$RUNNER_TEMP/solaris-build-backend" >> "$GITHUB_ENV"
      - name: Control-plane self-test
        run: python control-plane/meta_control_plane.py self-test
      - name: Full capability regression suite (supported POSIX runtimes)
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Router, assurance and explicit platform boundaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          foreach ($pattern in @('test_router.py', 'test_intake_features.py', 'test_assurance_packets.py', 'test_closure_hardening.py', 'test_fixture_runner.py', 'test_g16_takeover.py', 'test_explicit_runtime_setup.py')) {
            python -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build and smoke-test the installed wheel outside the checkout
        shell: bash
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheels"
          python - <<'PY'
          import os, pathlib, subprocess, sys, zipfile
          outside = pathlib.Path(os.environ['RUNNER_TEMP'])
          wheel = next((outside / 'wheels').glob('*.whl'))
          with zipfile.ZipFile(wheel) as package:
              assert not any(name.endswith('.pyc') for name in package.namelist())
              assert not any('/control-plane/' in name for name in package.namelist())
              assert 'solaris_intake/control_plane/policy.json' in package.namelist()
              source = pathlib.Path('control-plane/meta_control_plane.py').read_bytes()
              assert package.read('solaris_intake/control_plane/meta_control_plane.py') == source
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheel)])
          subprocess.check_call(['solaris-intake', 'self-test'], cwd=outside)
          subprocess.check_call(['solaris-intake', 'intake', '--explain', 'review this code'], cwd=outside)
          result = subprocess.check_output(['solaris-intake', 'skills', 'playwright', '--json'], cwd=outside, text=True)
          import json
          assert 'solaris.qa-engineer' in {item['id'] for item in json.loads(result)['skills']}
          PY
      - name: Control-plane JSON validity
        run: |
          python -c "
          import json
          for f in ['control-plane/roster.json','control-plane/policy.json','control-plane/budgets.json']:
              json.load(open(f)); print('OK', f)
          "

  network-tls-guidance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Obtain the pinned first-party Caddy test binary
        env:
          SOLARIS_CADDY_SHA512: a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7
        run: |
          curl --fail --location --silent --show-error https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz --output "$RUNNER_TEMP/caddy.tar.gz"
          printf '%s  %s\n' "$SOLARIS_CADDY_SHA512" "$RUNNER_TEMP/caddy.tar.gz" | sha512sum --check --status
          mkdir "$RUNNER_TEMP/caddy-test"
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP/caddy-test" caddy
      - name: Verify documented upstream trust, refusals and recovery using actual TLS
        env:
          SOLARIS_CADDY_BIN: ${{ runner.temp }}/caddy-test/caddy
        run: python -m unittest tests.test_g10_capability.VerifiedTlsGuidance -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Quality OS audit (61 employees, 0 gaps)
        run: |
          python3 employees/quality-security/assurance/quality_os.py audit > /tmp/audit.json
          python3 -c "
          import json, sys
          d = json.load(open('/tmp/audit.json'))
          scanned, gaps = d['counts']['skills_scanned'], d['counts']['gaps']
          print(f'scanned={scanned} gaps={gaps}')
          assert scanned == 61, f'expected 61 employees scanned, got {scanned}'
          assert gaps == 0, f'expected 0 gaps, got {gaps}: {d[\"gaps\"][:5]}'
          "

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: All plugin.json / capability.contract.json parse
        run: |
          python3 -c "
          import json, glob, sys
          bad = []
          for f in glob.glob('employees/*/*/plugin.json') + glob.glob('employees/*/*/capability.contract.json') + glob.glob('chief-of-staff/capability.contract.json'):
              try:
                  d = json.load(open(f))
                  if f.endswith('plugin.json'):
                      for k in ('name','version','description'):
                          if k not in d: bad.append(f'{f}: missing {k}')
              except Exception as e:
                  bad.append(f'{f}: {e}')
          assert not bad, '\n'.join(bad)
          print('all manifests parse OK')
          "
      - name: Search catalog matches existing skills and roster
        run: python tools/build_skill_catalog.py --check
      - name: Public source contains no symbolic links
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(['git', 'ls-files', '-s'], text=True).splitlines()
          links = [line.split('\t', 1)[1] for line in files if line.startswith('120000 ')]
          assert not links, f'Public source discovery rejects symbolic links: {links}'
          print('Public source contains no symbolic links')
          PY
      - name: Validate specialist and coordinator discovery metadata
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python tools/validate_skill_metadata.py
