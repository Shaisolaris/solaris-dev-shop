[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "solaris-dev-shop"
version = "0.55"
description = "61 portable specialist skills with searchable discovery and an explainable deterministic intake router."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["agents", "skills", "routing", "chief-of-staff"]

[project.scripts]
solaris-intake = "solaris_intake:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["solaris_intake*"]

# control-plane/ is symlinked into the package (solaris_intake/control-plane
# -> ../control-plane) so the wheel ships the router the entry point needs.
[tool.setuptools.package-data]
solaris_intake = ["control-plane/*.py", "control-plane/*.json", "control-plane/*.md"]
