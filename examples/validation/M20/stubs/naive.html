<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Solaris site finder</title><link rel="stylesheet" href="_common.css"><style>*:focus{outline:none}</style></head><body><header><b>Solaris</b> site finder</header><main>
<label for="q">Search sites</label><input id="q" autocomplete="off"><div id="status"></div>
<ul id="results"></ul></main>
<script>
const q = document.getElementById('q'), out = document.getElementById('results'), st = document.getElementById('status');
q.addEventListener('input', () => {
  st.textContent = 'Loading...';
  fetch('/api/search?q=' + encodeURIComponent(q.value)).then(r => r.json()).then(d => {   // no ok check, no stale guard
    st.textContent = '';
    out.innerHTML = d.results.map(x => '<li><span>' + x.name + '</span><button data-id="' + x.id + '">Save</button></li>').join('');
  });
});
out.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  fetch('/api/save', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: b.dataset.id})})
    .then(r => { out.innerHTML = r.ok ? '<li><span>Saved</span></li>' : '<li><span>Error saving</span></li>'; });  // re-render drops focus
});
</script></body></html>
