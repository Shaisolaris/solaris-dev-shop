# Synthetic clean control for G09: a queue worker and a nightly job. Not a real system.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger
  namespace: shop
spec:
  serviceName: ledger
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: ledger}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ledger}
    spec:
      containers:
      - name: ledger
        image: "registry.example.test/shop/ledger@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        args: ["--listen", ":7000"]
        ports:
        - {name: grpc, containerPort: 7000}
        env:
        - name: MESSAGE
          value: |
            multi-line value
            kept as text
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 1Gi
        readinessProbe:
          grpc: {port: 7000}
          periodSeconds: 5
        livenessProbe:
          tcpSocket: {port: grpc}
          periodSeconds: 20
          initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: shop
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: ledger}
  ports:
  - port: 7000
    targetPort: grpc
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: ledger, namespace: shop}
spec:
  minAvailable: 1
  selector:
    matchExpressions:
    - {key: app.kubernetes.io/name, operator: In, values: [ledger]}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
  namespace: shop
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: report
            image: registry.example.test/shop/report:2.0.1
            resources:
              requests: {cpu: 100m, memory: 128Mi}
              limits: {memory: 256Mi}
